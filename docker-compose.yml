name: damdam

x-api-service: &api-service
  build:
    context: ./apps/api
  image: ${DAMDAM_API_IMAGE:-damdam-api:local}
  env_file: ${DAMDAM_ENV_FILE:-compose.env}
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-damdam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-damdam}
    REDIS_URL: redis://redis:6379/0
    # The shared application env file must not expose backup credentials to
    # API/worker/beat; only postgres and the WAL-G companion receive them.
    WALG_R2_ACCESS_KEY_ID: ""
    WALG_R2_SECRET_ACCESS_KEY: ""
  networks: [damdam]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-walg-environment: &walg-environment
  WALG_S3_PREFIX: s3://${WALG_R2_BUCKET:?WALG_R2_BUCKET must be set}/${WALG_R2_PREFIX:-postgres}
  AWS_ACCESS_KEY_ID: ${WALG_R2_ACCESS_KEY_ID:?WALG_R2_ACCESS_KEY_ID must be set}
  AWS_SECRET_ACCESS_KEY: ${WALG_R2_SECRET_ACCESS_KEY:?WALG_R2_SECRET_ACCESS_KEY must be set}
  AWS_ENDPOINT: ${WALG_R2_ENDPOINT:?WALG_R2_ENDPOINT must be set}
  AWS_REGION: ${WALG_R2_REGION:-auto}
  AWS_S3_FORCE_PATH_STYLE: ${WALG_S3_FORCE_PATH_STYLE:-true}
  WALG_COMPRESSION_METHOD: zstd

services:
  api:
    <<: *api-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G

  postgres:
    build:
      context: .
      dockerfile: docker/postgres-walg/Dockerfile
      args:
        WALG_VERSION: v3.0.8
    image: ${DAMDAM_POSTGRES_IMAGE:-damdam-postgres-walg:local}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-damdam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-damdam}
      <<: *walg-environment
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [damdam]

  walg:
    build:
      context: .
      dockerfile: docker/postgres-walg/Dockerfile
      args:
        WALG_VERSION: v3.0.8
    image: ${DAMDAM_POSTGRES_IMAGE:-damdam-postgres-walg:local}
    user: postgres
    command: ["walg-backup-loop"]
    restart: unless-stopped
    environment:
      <<: *walg-environment
      PGDATA: /var/lib/postgresql/data
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-damdam}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-damdam}
      WALG_BACKUP_INTERVAL_SECONDS: ${WALG_BACKUP_INTERVAL_SECONDS:-86400}
      WALG_RETENTION_DAYS: "30"
      # Optional Uptime Kuma push-monitor URL (infrastructure.md §11.5) --
      # unset in local/dev/test, where no monitoring stack exists.
      KUMA_PUSH_URL: ${KUMA_PUSH_URL:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [damdam]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [damdam]

  worker:
    <<: *api-service
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  beat:
    <<: *api-service
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN must be set}
    depends_on:
      api:
        condition: service_healthy
    networks: [damdam]

networks:
  damdam:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
