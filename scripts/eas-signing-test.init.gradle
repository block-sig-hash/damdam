// CI-only simulation of the tasks.whenTaskAdded signing mutation made by
// EAS's generated eas-build.gradle. Never use this init script for a release.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.pluginManager.withPlugin('com.android.application') {
            // EAS creates the named signing config before registering its
            // task callback. Attach while the project is still evaluating:
            // afterEvaluate is too late for AGP 9's finalized storeFilePath.
            def android = project.extensions.getByName('android')
            android.signingConfigs.maybeCreate('release')
            project.tasks.whenTaskAdded {
                def signing = android.signingConfigs.release
                signing.storeFile = project.file(System.getenv('DAMDAM_TEST_EAS_KEYSTORE_PATH'))
                signing.storePassword = System.getenv('DAMDAM_TEST_EAS_STORE_PASSWORD')
                signing.keyAlias = System.getenv('DAMDAM_TEST_EAS_KEY_ALIAS')
                signing.keyPassword = System.getenv('DAMDAM_TEST_EAS_KEY_PASSWORD')
                android.buildTypes.release.signingConfig signing
            }
        }
    }
}
