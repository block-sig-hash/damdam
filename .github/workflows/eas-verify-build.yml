name: EAS On-Demand Build Verification

# Manual EAS cloud build probe. The old incoming CallKit/PushKit bridge was
# retired in chunk 04; this workflow does not restore it. A successful probe
# is not proof of approved distribution signing, privacy labels, live calling
# or physical installation. It never submits to a store.
#
# Deliberately blocks and waits for the real build result (no
# --no-wait) so this job's own exit code and log directly reflect
# whether the EAS cloud build actually succeeded, not just that it
# was queued.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: ios
        type: choice
        options: [ios, android]
      profile:
        description: "eas.json build profile"
        required: true
        default: development
        type: choice
        options: [development, production]

jobs:
  eas-build:
    name: EAS Build (${{ inputs.platform }}, ${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g eas-cli
      - name: EAS Build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --json > eas-build-result.json
          echo "## EAS build result" >> "$GITHUB_STEP_SUMMARY"
          cat eas-build-result.json | tee -a "$GITHUB_STEP_SUMMARY"
