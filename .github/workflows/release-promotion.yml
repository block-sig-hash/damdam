name: Release Promotion Signoff

# Run only trusted base-branch code; treat promotion PR objects as data.
# The custom PR-head status must be required by main branch protection.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  statuses: write

jobs:
  validate-release-signoff:
    name: Validate release signoff artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch promotion and staging commits as data
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/staging:refs/remotes/origin/staging
          git fetch origin "$PR_HEAD"
      - name: Validate using trusted base-branch code
        id: validation
        continue-on-error: true
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DAMDAM_RELEASE_PUBLIC_KEY_B64: ${{ vars.DAMDAM_RELEASE_PUBLIC_KEY_B64 }}
        run: scripts/validate-release-signoff.sh "$PR_HEAD"
      - name: Report trusted result on exact PR head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.validation.outcome }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$RESULT" = success ]; then
            state=success
          else
            state=failure
          fi
          gh api "repos/$GH_REPOSITORY/statuses/$PR_HEAD" \
            -f state="$state" \
            -f context='release-signoff/trusted' \
            -f description="Trusted release signoff validation: $state"
          test "$state" = success
