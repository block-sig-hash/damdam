name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-api:
    name: Deploy API + Dashboard to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to OCI via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_DEPLOY_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /opt/damdam
            git pull origin main
            docker compose build
            docker compose up -d
            docker compose exec -T api alembic upgrade head

      - name: Health check
        run: |
          sleep 15
          curl --fail https://api.damdam.app/health || exit 1

      - name: Deploy dashboard to Cloudflare Workers
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Both mobile release jobs use EAS Build (Expo's cloud build
  # service) rather than local/runner-side compilation. This does
  # NOT mean the app is built with the Expo framework — it's a
  # standard bare React Native project (direct native code access,
  # needed for the eSIM/Twilio Voice/CallKit native modules); EAS
  # Build works with bare RN projects via eas.json, no Expo SDK
  # or config-plugin adoption required. This is a deliberate choice,
  # not a default: the founder's local dev machine is Windows/Linux,
  # not macOS, and Xcode — required to build iOS at all, even for
  # CI — only runs on macOS. EAS Build compiles both platforms on
  # Expo's own infrastructure, so neither this workflow nor local
  # development needs a Mac or a rented macOS instance for routine
  # builds. See docs/infrastructure.md §11.9 for the full reasoning.

  release-android:
    name: Build & submit Android via EAS
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g eas-cli
      - name: EAS Build (Android)
        working-directory: apps/mobile
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Submit to Play Console (internal track)
        working-directory: apps/mobile
        run: eas submit --platform android --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  release-ios:
    name: Build & submit iOS via EAS
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g eas-cli
      - name: EAS Build (iOS)
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Submit to TestFlight
        working-directory: apps/mobile
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
