name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  # Powers the iOS screenshot job below, which deliberately does not run
  # on every PR (macOS runners cost ~10x an ubuntu-latest minute) --
  # nightly plus on-demand keeps it exercised without that recurring
  # per-PR cost. See docs/testing-qa.md's screenshot-generation-CI
  # amendment for the full cost rationale.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

jobs:
  # Path-filters which of the four jobs below actually need to run,
  # based on what changed. This job itself always runs (the workflow's
  # `on:` trigger is untouched), so every downstream job name is still
  # reported to GitHub even when its `if:` skips it — a skipped job
  # reports conclusion=skipped, which GitHub's required-status-checks
  # treats as passing, not as pending/failing. Gating at the *job*
  # level like this (rather than filtering the whole workflow's `on:`
  # trigger with top-level `paths:`) is deliberate: top-level `paths:`
  # would make the workflow never run at all for a non-matching PR, so
  # branch protection would see those check names as never-reported
  # ("Expected — waiting for status") rather than skipped/passing,
  # which blocks merge instead of allowing it.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # Declaring any job-level `permissions:` switches that job from
    # GitHub's default (permissive) token to an explicit allow-list for
    # every scope -- `contents: read` must be listed here too, or
    # actions/checkout below fails ("repository not found", GitHub's
    # generic error for a token that can't read the repo at all).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # This workflow file itself is included in every group as a
          # safety net: a change to CI logic should re-validate against
          # all four jobs, not silently trust the new filtering.
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'apps/api/**'
              - 'docker/**'
              - 'scripts/test-walg-pitr.sh'
              - 'docker-compose.yml'
              - 'docker-compose.walg-test.yml'
              - 'compose.walg-test.env'
              - 'compose.env.example'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.github/workflows/ci.yml'

  # US-42 / AC-27.7: the specification suite is now a working artifact --
  # docs/implementation/ routes every build chunk through relative links
  # between chunk files, review records, the story map and the specs. A
  # broken link there silently drops an assignment or an acceptance
  # criterion, which no other job would notice. Gated on the docs filter so
  # it costs nothing on code-only PRs, and skipped-is-passing keeps the
  # check name reported either way (see the `changes` job's comment).
  docs-links:
    name: Docs — Link validation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate relative documentation links
        run: bash docs/implementation/tools/check-docs-links.sh

  lint-and-test-api:
    name: API — Lint, type-check, test
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: damdam_test
          POSTGRES_PASSWORD: damdam_test
          POSTGRES_DB: damdam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U damdam_test -d damdam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://damdam_test:damdam_test@localhost:5432/damdam_test
      TEST_DATABASE_URL: postgresql+psycopg://damdam_test:damdam_test@localhost:5432/damdam_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy app
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Test (pytest)
        run: pytest --cov=app
      - name: Export OpenAPI spec and check for drift
        run: |
          python -c "from app.main import app; import json; json.dump(app.openapi(), open('openapi-generated.json', 'w'))"
          # Compare against committed docs/api-spec.yaml — fails
          # the check if the API implementation has drifted from
          # the documented contract without an updated spec commit
          python scripts/check_api_spec_drift.py

  lint-and-test-dashboard:
    name: Dashboard — Lint, type-check, test
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('apps/dashboard/package.json') != '' }}
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json
      - if: ${{ hashFiles('apps/dashboard/package.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('apps/dashboard/package.json') != '' }}
        run: npm run lint
      - if: ${{ hashFiles('apps/dashboard/package.json') != '' }}
        run: npm run type-check
      - if: ${{ hashFiles('apps/dashboard/package.json') != '' }}
        run: npm run test

  lint-and-test-mobile:
    name: Mobile — Lint, type-check, test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        if: ${{ hashFiles('apps/mobile/android/gradlew') != '' }}
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/*.gradle
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        run: npm run lint
      - if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        run: npm run type-check
      - if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        run: npm run test
      - name: Compile Android debug app
        if: ${{ hashFiles('apps/mobile/android/gradlew') != '' }}
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

  # Renders real screens on a real Android emulator via the screenshot
  # harness (apps/mobile/screenshotHarness/README.md) and Maestro flows
  # (apps/mobile/maestro/screens/*.yaml), closing the gap flagged in
  # docs/testing-qa.md's screenshot-generation-CI amendment and in
  # claude-review.yml's own header comment: mobile visual review had no
  # way to see a rendered screen, only diffs. Runs on ubuntu-latest (no
  # macOS surcharge) so it's affordable on every mobile PR, unlike the
  # iOS job below.
  screenshot-mobile-android:
    name: Mobile — Android screenshot generation
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.mobile == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/*.gradle
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - run: npm ci
      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # Debug builds load JS from a live Metro server rather than bundling
      # it (android/app/build.gradle's react{} block defaults
      # debuggableVariants to ["debug", "debugOptimized"]), so a debug
      # APK alone wouldn't pick up SCREENSHOT_HARNESS_MODE. The release
      # build type bundles JS offline at build time and, per this repo's
      # current android/app/build.gradle, is signed with the same
      # checked-in debug keystore as the debug build (no release signing
      # secret needed) -- so building "release" here gets us an
      # offline-bundled, installable APK with the harness baked in.
      - name: Build harness-mode release APK
        working-directory: apps/mobile/android
        env:
          SCREENSHOT_HARNESS_MODE: "true"
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install APK, run Maestro flows
        # This action's `script` runs from $GITHUB_WORKSPACE (repo root),
        # not this job's `defaults.run.working-directory` -- composite
        # actions don't inherit that setting, so paths below are spelled
        # out relative to the repo root rather than apps/mobile.
        # api-level 28 (not a newer one like 34): a real community
        # reference config for this exact action+ubuntu-latest+Maestro
        # combination (github.com/retyui/Using-GitHub-Actions-to-run-
        # your-Maestro-Flows) explicitly documents only api-level
        # 26-28 as stable on ubuntu-* runners. This app's
        # minSdkVersion is 24 (android/build.gradle), so 28 is well
        # within range. NOTE: switching to 28 alone did NOT fix the
        # empty-screenshot-artifact finding or the 7/12-flows-failed
        # pattern seen during initial verification -- those turned out
        # to be real bugs (see docs/testing-qa.md §14.11's verification
        # history), not an api-level 34 instability issue. Kept at 28
        # anyway per this reference's stability guidance and because
        # reverting to 34 was never re-tested once the real bugs were
        # fixed.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_6
          # Pin the emulator binary proven by the successful screenshot run.
          # The mutable `latest` package intermittently returned a corrupt ZIP
          # from sdkmanager before the emulator could even boot.
          emulator-build: 15507667
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/scripts/run-maestro-android-ci.sh
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          find maestro-output -type f -path '*/takeScreenshot/*.png' -exec cp {} screenshots/ \; 2>/dev/null || true
          ls -la screenshots
      # US-42 / AC-42.2. This replaced `test "${#screenshots[@]}" -eq 32`,
      # which proved only that *some* 32 PNGs existed -- it accepted a set
      # where a missing screen was masked by an unrelated file, and it
      # accepted zero-byte or truncated captures. The validator derives the
      # expected screen/locale set from the Maestro flows themselves
      # (scripts/screenshotMatrix.js), so the matrix cannot drift from what
      # this job actually runs and no screenshot count is hardcoded here.
      # Node tooling uses the dev dependencies installed by npm ci. If setup
      # failed, validation also fails; artifact upload still runs independently.
      - name: Validate screenshot artifact completeness
        if: always()
        run: |
          node scripts/validateScreenshots.js --platform android
          test -s maestro-report.xml
      - name: Upload screenshots as CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots-android
          path: |
            apps/mobile/screenshots/*.png
            apps/mobile/maestro-report.xml
          if-no-files-found: error
      - name: Upload Maestro output bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots-android-maestro-output
          path: apps/mobile/maestro-output
          if-no-files-found: warn
      # Inline preview in the job's own Summary tab -- reviewers (human or
      # Claude in claude-review.yml) can see every captured screen without
      # downloading the artifact zip. Thumbnails only (full-resolution
      # PNGs are in the artifact above): GITHUB_STEP_SUMMARY has a ~1MiB
      # cap, and full-size phone screenshots would blow past it. Never
      # fall back to embedding the source PNG when thumbnailing fails.
      - name: Render inline screenshot preview in job summary
        if: always()
        run: |
          echo "## Android screenshot preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Full-resolution PNGs are attached as the mobile-screenshots-android artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in screenshots/*.png; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .png)
            thumb="screenshots/${name}.thumb.jpg"
            if command -v magick >/dev/null 2>&1; then
              magick "$f" -resize 96x -quality 35 "$thumb" 2>/dev/null || true
            elif command -v convert >/dev/null 2>&1; then
              convert "$f" -resize 96x -quality 35 "$thumb" 2>/dev/null || true
            fi
            echo "**${name}**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ ! -s "$thumb" ]; then
              echo "_Thumbnail unavailable; see the full-resolution artifact._" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            b64=$(base64 -w0 "$thumb")
            echo "![${name}](data:image/jpeg;base64,${b64})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

  # iOS mirror of screenshot-mobile-android, capturing the eSIM
  # activation flow's real platform divergence (frontend-mobile.md's
  # "iOS has no public API for programmatic eSIM installation" --
  # esim-activation-ios.yaml vs. Android's esim-activation-android.yaml).
  # Deliberately NOT run on every PR: macOS runners bill at roughly
  # 10x an ubuntu-latest minute, and this is testing infrastructure, not
  # the safety-critical path -- nightly plus on-demand (workflow_dispatch)
  # is the affordable cadence for now. Re-evaluate if iOS-specific visual
  # regressions start slipping through between nightly runs.
  #
  # runs-on is macos-15, not macos-14: RN 0.86 requires Xcode >= 16.1
  # (react-native-nitro-modules' Podfile enforces this), and macos-14's
  # *default* selected Xcode is 15.4 (it has 16.1/16.2 installed but not
  # selected) -- confirmed by a real `pod install` failure on macos-14
  # in this job ("React Native requires XCode >= 16.1. Found 15.4.")
  # during initial verification. macos-15 defaults to Xcode 16.4, which
  # satisfies the requirement without an extra xcode-select step.
  screenshot-mobile-ios:
    name: Mobile — iOS screenshot generation (nightly/on-demand)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install
      # Building against a *named concrete device* destination
      # (`-destination 'platform=iOS Simulator,name=iPhone 16'`) proved
      # flaky during initial CI verification: which concrete simulator
      # instances CoreSimulator reports as "currently available" varied
      # run to run on freshly-booted runner VMs (one run listed dozens
      # of iPhone/iPad devices at that exact destination-resolution
      # moment, the next listed almost none, despite the same runner
      # image and Xcode version) -- a likely CoreSimulator-daemon
      # population race, not a real device-catalog gap. `generic/
      # platform=iOS Simulator` builds an SDK-generic simulator binary
      # without needing to resolve any concrete device instance at
      # build time, sidestepping that race entirely. The concrete
      # device only needs to exist for the *install/run* step below,
      # via `simctl create`, which creates a fresh instance from
      # Xcode's fixed device-*type* catalog rather than depending on
      # what instances already happen to exist -- a more reliable
      # operation than destination-matching proved to be.
      - name: Build harness-mode Release app for the simulator
        working-directory: apps/mobile/ios
        env:
          SCREENSHOT_HARNESS_MODE: "true"
        run: |
          xcodebuild \
            -workspace DamDam.xcworkspace \
            -scheme DamDam \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            build
      # "iPhone 16" here is a device *type* from Xcode's fixed catalog,
      # not a currently-existing instance -- if a future runner image
      # drops this device type, `xcrun simctl list devicetypes` on that
      # image will show what's available to update this to.
      - name: Boot simulator and install the app
        run: |
          DEVICE_ID=$(xcrun simctl create DamDamScreenshotCI "iPhone 16" 2>/dev/null || xcrun simctl list devices | grep DamDamScreenshotCI | grep -oE '[0-9A-F-]{36}')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl install "$DEVICE_ID" "ios/build/Build/Products/Release-iphonesimulator/DamDam.app"
      # The 2026-09-07 nightly failed here with
      # `xcuitest.installer.LocalXCTestInstaller$IOSDriverTimeoutException:
      # iOS driver not ready in time` after ~2m36s, producing 0 screenshots,
      # while 2026-09-08 succeeded on the identical commit with the XCUITest
      # driver ready in ~64s. A slow XCUITest cold start is a hypothesis; these
      # logs locate the timeout but do not distinguish slowness from a hang.
      # Raise the timeout named by Maestro, pending a new macOS CI run.
      # 300000ms is ~4.7x the observed healthy startup, and still bounded so a
      # genuinely wedged driver fails instead of burning the job's time.
      - name: Run Maestro flows
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          maestro --device "$DEVICE_ID" test maestro/screens \
            --exclude-tags android-only \
            --format junit \
            --output maestro-report.xml \
            --test-output-dir="$PWD/maestro-output"
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          find maestro-output -type f -path '*/takeScreenshot/*.png' -exec cp {} screenshots/ \; 2>/dev/null || true
          ls -la screenshots
      # US-42 / AC-42.2. This replaced `test "${#screenshots[@]}" -eq 32`,
      # which proved only that *some* 32 PNGs existed -- it accepted a set
      # where a missing screen was masked by an unrelated file, and it
      # accepted zero-byte or truncated captures. The validator derives the
      # expected screen/locale set from the Maestro flows themselves
      # (scripts/screenshotMatrix.js), so the matrix cannot drift from what
      # this job actually runs and no screenshot count is hardcoded here.
      # Node tooling uses the dev dependencies installed by npm ci. If setup
      # failed, validation also fails; artifact upload still runs independently.
      - name: Validate screenshot artifact completeness
        if: always()
        run: |
          node scripts/validateScreenshots.js --platform ios
          test -s maestro-report.xml
      - name: Upload Maestro output bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots-ios-maestro-output
          path: apps/mobile/maestro-output
          if-no-files-found: warn
      - name: Upload screenshots as CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots-ios
          path: |
            apps/mobile/screenshots/*.png
            apps/mobile/maestro-report.xml
          if-no-files-found: error
      - name: Render inline screenshot preview in job summary
        if: always()
        run: |
          echo "## iOS screenshot preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Full-resolution PNGs are attached as the mobile-screenshots-ios artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in screenshots/*.png; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .png)
            thumb="screenshots/${name}.thumb.jpg"
            sips -s format jpeg -s formatOptions 35 -Z 96 "$f" --out "$thumb" >/dev/null 2>&1 || true
            echo "**${name}**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ ! -s "$thumb" ]; then
              echo "_Thumbnail unavailable; see the full-resolution artifact._" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            b64=$(base64 -i "$thumb" | tr -d '\n')
            echo "![${name}](data:image/jpeg;base64,${b64})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

  build-check:
    name: Docker build check (multi-arch)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate seven-service Compose configuration
        run: docker compose --env-file compose.env.example config --quiet
      - name: Build API and WAL-G Postgres from Compose
        run: docker compose --env-file compose.env.example build api postgres
      - name: Smoke-test readiness with real Postgres and Redis
        run: |
          cleanup() {
            docker compose --env-file compose.env.example down --volumes
          }
          trap cleanup EXIT
          docker compose --env-file compose.env.example up -d --wait postgres redis api
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/health
          docker compose --env-file compose.env.example stop redis
          status=$(curl --silent --show-error --max-time 10 \
            --output /tmp/readiness.json --write-out '%{http_code}' \
            http://127.0.0.1:8000/health)
          test "$status" = "503"
          grep --quiet '"redis":"unavailable"' /tmp/readiness.json
      - name: Prove WAL-G continuous archive and point-in-time recovery
        run: ./scripts/test-walg-pitr.sh
      - name: Build API image for both architectures
        # Catches aarch64 wheel/dependency availability issues in
        # CI rather than at OCI deploy time — see
        # docs/infrastructure.md §11.9.2 and
        # docs/scaling-infrastructure.md §12.2. This is what lets
        # local development stay on the founder's actual machine
        # (x86, per infrastructure.md §11.9) without losing early
        # warning on ARM-specific breakage before it reaches the
        # OCI Ampere A1 production instance.
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t damdam-api:ci \
            ./apps/api
      - name: Build Postgres + WAL-G image for both architectures
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t damdam-postgres-walg:ci \
            -f docker/postgres-walg/Dockerfile \
            .

  deploy-staging:
    name: Deploy develop to staging
    needs:
      - lint-and-test-api
      - lint-and-test-dashboard
      - lint-and-test-mobile
      - build-check
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    # This repo's org/repo-level default is a read-only GITHUB_TOKEN
    # (Settings > Actions > "Read repository contents" default) --
    # every other job here either doesn't need to write, or (like
    # `changes`) explicitly opts into a narrow write. This job now
    # needs contents: write for the "Advance staging branch" step
    # below, which pushes to refs/heads/staging.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone. The "Advance staging
          # branch" step below pushes HEAD to refs/heads/staging as a plain
          # fast-forward; from a depth-1 clone the runner does not have
          # staging's commit object, so git cannot demonstrate the update is a
          # fast-forward and the push is rejected with "remote contains work
          # that you do not have" -- even when staging is genuinely an ancestor
          # of the deployed commit. release-promotion.yml already takes
          # fetch-depth: 0 for the same class of reason.
          fetch-depth: 0

      - name: Validate staging deployment secrets
        env:
          STAGING_OCI_HOST: ${{ secrets.STAGING_OCI_HOST }}
          STAGING_OCI_DEPLOY_USER: ${{ secrets.STAGING_OCI_DEPLOY_USER }}
          STAGING_OCI_SSH_KEY: ${{ secrets.STAGING_OCI_SSH_KEY }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          missing=""
          for name in STAGING_OCI_HOST STAGING_OCI_DEPLOY_USER STAGING_OCI_SSH_KEY STAGING_API_BASE_URL; do
            if [ -z "$(printenv "$name")" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Staging deploy is configured but cannot run. Add these secrets to the staging GitHub Environment:$missing"
            exit 1
          fi

      - name: Deploy API stack to staging
        id: staging-deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_OCI_HOST }}
          username: ${{ secrets.STAGING_OCI_DEPLOY_USER }}
          key: ${{ secrets.STAGING_OCI_SSH_KEY }}
          script: |
            set -eu
            cd /opt/damdam
            git fetch origin develop
            previous_commit=$(git rev-parse HEAD)
            target_commit=$(git rev-parse origin/develop)
            mkdir -p .deploy
            rm -f .deploy/staging_previous_commit
            current_container=$(docker ps -q \
              --filter label=com.docker.compose.project=damdam \
              --filter label=com.docker.compose.service=api | head -n 1)
            current_postgres_container=$(docker ps -q \
              --filter label=com.docker.compose.project=damdam \
              --filter label=com.docker.compose.service=postgres | head -n 1)
            if [ -n "$current_container" ] && [ -n "$current_postgres_container" ]; then
              current_image=$(docker inspect --format '{{.Image}}' "$current_container")
              current_postgres_image=$(docker inspect --format '{{.Image}}' "$current_postgres_container")
              docker tag "$current_image" "damdam-api:$previous_commit"
              docker tag "$current_postgres_image" "damdam-postgres-walg:$previous_commit"
              printf '%s\n' "$previous_commit" > .deploy/staging_previous_commit
            else
              echo "No complete prior API/Postgres release exists; this is a staging bootstrap with no automatic rollback target."
            fi
            git checkout --detach "$target_commit"
            DAMDAM_ENV_FILE=.env.staging \
              DAMDAM_API_IMAGE="damdam-api:$target_commit" \
              DAMDAM_POSTGRES_IMAGE="damdam-postgres-walg:$target_commit" \
              docker compose --env-file .env.staging build api postgres
            DAMDAM_ENV_FILE=.env.staging \
              DAMDAM_API_IMAGE="damdam-api:$target_commit" \
              DAMDAM_POSTGRES_IMAGE="damdam-postgres-walg:$target_commit" \
              docker compose --env-file .env.staging up -d --remove-orphans
            DAMDAM_ENV_FILE=.env.staging \
              DAMDAM_API_IMAGE="damdam-api:$target_commit" \
              DAMDAM_POSTGRES_IMAGE="damdam-postgres-walg:$target_commit" \
              docker compose --env-file .env.staging exec -T api alembic upgrade head

      - name: Check staging readiness
        id: staging-health
        if: steps.staging-deploy.outcome == 'success'
        continue-on-error: true
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${STAGING_API_BASE_URL%/}/health"

      # docs/infrastructure.md §11.14: the `staging` branch is meant to
      # always reflect exactly what's actually running (and confirmed
      # healthy) on the staging environment, not just wherever `develop`
      # happens to be -- that's what makes a later `staging`->`main`
      # promotion PR meaningful (you're promoting what was validated,
      # not an arbitrary later commit that was never deployed here). A
      # plain (non-force) push, so it only ever fast-forwards; if it
      # can't fast-forward, something has directly modified `staging`
      # out of band and that needs human eyes, not a silent overwrite.
      - name: Advance staging branch to deployed commit
        if: steps.staging-health.outcome == 'success'
        run: git push origin HEAD:refs/heads/staging

      - name: Roll back failed staging release
        if: steps.staging-deploy.outcome == 'failure' || steps.staging-health.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_OCI_HOST }}
          username: ${{ secrets.STAGING_OCI_DEPLOY_USER }}
          key: ${{ secrets.STAGING_OCI_SSH_KEY }}
          script: |
            set -eu
            cd /opt/damdam
            if [ ! -s .deploy/staging_previous_commit ]; then
              echo "No previous staging release exists; this was the bootstrap deploy and cannot be rolled back automatically."
              exit 0
            fi
            previous_commit=$(cat .deploy/staging_previous_commit)
            docker image inspect "damdam-api:$previous_commit" >/dev/null
            docker image inspect "damdam-postgres-walg:$previous_commit" >/dev/null
            git checkout --detach "$previous_commit"
            DAMDAM_ENV_FILE=.env.staging \
              DAMDAM_API_IMAGE="damdam-api:$previous_commit" \
              DAMDAM_POSTGRES_IMAGE="damdam-postgres-walg:$previous_commit" \
              docker compose --env-file .env.staging up -d --no-build --remove-orphans

      - name: Fail unsuccessful staging deployment
        if: >-
          always() &&
          (steps.staging-deploy.outcome == 'failure' ||
          steps.staging-health.outcome == 'failure')
        run: |
          echo "::error::Staging deployment failed. The previous release was restored when one existed; inspect the deploy logs."
          exit 1
