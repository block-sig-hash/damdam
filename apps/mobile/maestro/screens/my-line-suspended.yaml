appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- tapOn:
    id: "harness-target-my-line-suspended"
- assertVisible:
    id: "my-line-next-suspended"
- takeScreenshot: my-line-suspended-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- tapOn:
    id: "harness-target-my-line-suspended"
- assertVisible:
    id: "my-line-next-suspended"
- takeScreenshot: my-line-suspended-fr
