appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-cli-verify-confirm"
    direction: DOWN
- tapOn:
    id: "harness-target-cli-verify-confirm"
- assertVisible:
    id: "cli-confirm-submit"
- takeScreenshot: cli-verify-confirm-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-cli-verify-confirm"
    direction: DOWN
- tapOn:
    id: "harness-target-cli-verify-confirm"
- assertVisible:
    id: "cli-confirm-submit"
- takeScreenshot: cli-verify-confirm-fr
