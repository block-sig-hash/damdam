appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-plans-device-unsupported"
    direction: DOWN
- tapOn:
    id: "harness-target-plans-device-unsupported"
- assertVisible:
    id: "device-incapable"
- takeScreenshot: plans-device-unsupported-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-plans-device-unsupported"
    direction: DOWN
- tapOn:
    id: "harness-target-plans-device-unsupported"
- assertVisible:
    id: "device-incapable"
- takeScreenshot: plans-device-unsupported-fr
