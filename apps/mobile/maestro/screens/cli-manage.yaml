appId: com.damdam.app
---
# Unlike the other CLI screens, CliManageScreen makes a real getCliStatus
# fetch on mount that fetchMock.ts doesn't route (see registry.tsx's own
# note) -- it renders its "Caller ID" / "Loading..." state here rather than
# a populated one. "Caller ID" is present in every state, so it's the
# stable thing to assert on.
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-cli-manage"
    direction: DOWN
- tapOn:
    id: "harness-target-cli-manage"
- assertVisible:
    id: "cli-manage-title"
- takeScreenshot: cli-manage-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-cli-manage"
    direction: DOWN
- tapOn:
    id: "harness-target-cli-manage"
- assertVisible:
    id: "cli-manage-title"
- takeScreenshot: cli-manage-fr
