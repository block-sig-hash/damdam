appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-consumer-sign-in"
    direction: DOWN
- tapOn:
    id: "harness-target-consumer-sign-in"
- assertVisible:
    id: "sign-in-email-input"
- takeScreenshot: consumer-sign-in-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-consumer-sign-in"
    direction: DOWN
- tapOn:
    id: "harness-target-consumer-sign-in"
- assertVisible:
    id: "sign-in-email-input"
- takeScreenshot: consumer-sign-in-fr
