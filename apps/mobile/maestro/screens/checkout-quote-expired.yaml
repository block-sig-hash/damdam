appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-checkout-quote-expired"
    direction: DOWN
- tapOn:
    id: "harness-target-checkout-quote-expired"
- assertVisible:
    id: "quote-expired"
- takeScreenshot: checkout-quote-expired-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-checkout-quote-expired"
    direction: DOWN
- tapOn:
    id: "harness-target-checkout-quote-expired"
- assertVisible:
    id: "quote-expired"
- takeScreenshot: checkout-quote-expired-fr
