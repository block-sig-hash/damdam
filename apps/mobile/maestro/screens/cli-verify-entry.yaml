appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-cli-verify-entry"
    direction: DOWN
- tapOn:
    id: "harness-target-cli-verify-entry"
- assertVisible:
    id: "cli-verify-entry-input"
- takeScreenshot: cli-verify-entry-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-cli-verify-entry"
    direction: DOWN
- tapOn:
    id: "harness-target-cli-verify-entry"
- assertVisible:
    id: "cli-verify-entry-input"
- takeScreenshot: cli-verify-entry-fr
