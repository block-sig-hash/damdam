appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-order-confirming-payment"
    direction: DOWN
- tapOn:
    id: "harness-target-order-confirming-payment"
- assertVisible:
    id: "order-confirming"
- takeScreenshot: order-confirming-payment-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-order-confirming-payment"
    direction: DOWN
- tapOn:
    id: "harness-target-order-confirming-payment"
- assertVisible:
    id: "order-confirming"
- takeScreenshot: order-confirming-payment-fr
