appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- tapOn:
    id: "harness-target-pin-setup"
- assertVisible:
    id: "pin-setup-input"
- takeScreenshot: pin-setup-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- tapOn:
    id: "harness-target-pin-setup"
- assertVisible:
    id: "pin-setup-input"
- takeScreenshot: pin-setup-fr
