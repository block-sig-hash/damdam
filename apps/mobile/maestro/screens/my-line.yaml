appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- tapOn:
    id: "harness-target-my-line"
- assertVisible:
    id: "my-line"
- takeScreenshot: my-line-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- tapOn:
    id: "harness-target-my-line"
- assertVisible:
    id: "my-line"
- takeScreenshot: my-line-fr
