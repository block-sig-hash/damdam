appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-activation-success"
    direction: DOWN
- tapOn:
    id: "harness-target-activation-success"
- assertVisible:
    id: "activation-success"
- takeScreenshot: activation-success-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-activation-success"
    direction: DOWN
- tapOn:
    id: "harness-target-activation-success"
- assertVisible:
    id: "activation-success"
- takeScreenshot: activation-success-fr
