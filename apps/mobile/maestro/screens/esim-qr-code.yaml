appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-esim-qr-code"
    direction: DOWN
- tapOn:
    id: "harness-target-esim-qr-code"
- assertVisible:
    id: "esim-qr-code-screen"
- takeScreenshot: esim-qr-code-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-esim-qr-code"
    direction: DOWN
- tapOn:
    id: "harness-target-esim-qr-code"
- assertVisible:
    id: "esim-qr-code-screen"
- takeScreenshot: esim-qr-code-fr
