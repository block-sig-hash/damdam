appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-consumer-home-error"
    direction: DOWN
- tapOn:
    id: "harness-target-consumer-home-error"
- assertVisible:
    id: "home-error"
- takeScreenshot: consumer-home-error-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-consumer-home-error"
    direction: DOWN
- tapOn:
    id: "harness-target-consumer-home-error"
- assertVisible:
    id: "home-error"
- takeScreenshot: consumer-home-error-fr
