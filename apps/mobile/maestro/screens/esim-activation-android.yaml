appId: com.damdam.app
tags:
  - android-only
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-esim-activation-prompt-android"
    direction: DOWN
- tapOn:
    id: "harness-target-esim-activation-prompt-android"
- assertVisible:
    id: "esim-arrival-prompt"
- takeScreenshot: esim-activation-prompt-android-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-esim-activation-prompt-android"
    direction: DOWN
- tapOn:
    id: "harness-target-esim-activation-prompt-android"
- assertVisible:
    id: "esim-arrival-prompt"
- takeScreenshot: esim-activation-prompt-android-fr
