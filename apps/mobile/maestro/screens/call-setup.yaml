appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-call-setup"
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: "harness-target-call-setup"
- assertVisible:
    id: "calls-screen"
- takeScreenshot: call-setup-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-call-setup"
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: "harness-target-call-setup"
- assertVisible:
    id: "calls-screen"
- takeScreenshot: call-setup-fr
