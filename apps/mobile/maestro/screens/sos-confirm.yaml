appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-sos-confirm"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "harness-target-sos-confirm"
- assertVisible:
    id: "sos-confirm-screen"
- takeScreenshot: sos-confirm-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-sos-confirm"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "harness-target-sos-confirm"
- assertVisible:
    id: "sos-confirm-screen"
- takeScreenshot: sos-confirm-fr
