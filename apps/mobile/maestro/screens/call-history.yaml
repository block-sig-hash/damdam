appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-call-history"
    direction: DOWN
- tapOn:
    id: "harness-target-call-history"
- assertVisible:
    id: "calls-screen"
- takeScreenshot: call-history-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-call-history"
    direction: DOWN
- tapOn:
    id: "harness-target-call-history"
- assertVisible:
    id: "calls-screen"
- takeScreenshot: call-history-fr
