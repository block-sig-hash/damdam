appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- tapOn:
    id: "harness-target-my-line-usage-unmeasured"
- assertVisible:
    id: "my-line-usage-data"
- takeScreenshot: my-line-usage-unmeasured-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- tapOn:
    id: "harness-target-my-line-usage-unmeasured"
- assertVisible:
    id: "my-line-usage-data"
- takeScreenshot: my-line-usage-unmeasured-fr
