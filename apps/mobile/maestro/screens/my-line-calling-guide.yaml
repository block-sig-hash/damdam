appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-my-line-calling-guide"
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: "harness-target-my-line-calling-guide"
- assertVisible:
    id: "calling-guide"
- takeScreenshot: my-line-calling-guide-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-my-line-calling-guide"
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: "harness-target-my-line-calling-guide"
- assertVisible:
    id: "calling-guide"
- takeScreenshot: my-line-calling-guide-fr
