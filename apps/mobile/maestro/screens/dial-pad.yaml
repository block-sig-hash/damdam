appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-dial-pad"
    direction: DOWN
- tapOn:
    id: "harness-target-dial-pad"
- assertVisible:
    id: "dialed-number"
- takeScreenshot: dial-pad-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-dial-pad"
    direction: DOWN
- tapOn:
    id: "harness-target-dial-pad"
- assertVisible:
    id: "dialed-number"
- takeScreenshot: dial-pad-fr
