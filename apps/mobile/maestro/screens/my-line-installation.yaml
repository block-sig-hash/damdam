appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-my-line-installation"
    direction: DOWN
- tapOn:
    id: "harness-target-my-line-installation"
- assertVisible:
    id: "install-profile"
- takeScreenshot: my-line-installation-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-my-line-installation"
    direction: DOWN
- tapOn:
    id: "harness-target-my-line-installation"
- assertVisible:
    id: "install-profile"
- takeScreenshot: my-line-installation-fr
