appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-package-selection"
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: "harness-target-package-selection"
- assertVisible:
    id: "package-selection-screen"
- takeScreenshot: package-selection-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-package-selection"
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: "harness-target-package-selection"
- assertVisible:
    id: "package-selection-screen"
- takeScreenshot: package-selection-fr
