appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-order-payment-declined"
    direction: DOWN
- tapOn:
    id: "harness-target-order-payment-declined"
- assertVisible:
    id: "order-declined"
- takeScreenshot: order-payment-declined-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-order-payment-declined"
    direction: DOWN
- tapOn:
    id: "harness-target-order-payment-declined"
- assertVisible:
    id: "order-declined"
- takeScreenshot: order-payment-declined-fr
