appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-plans"
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: "harness-target-plans"
- assertVisible:
    id: "plan-list"
- takeScreenshot: plans-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-plans"
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: "harness-target-plans"
- assertVisible:
    id: "plan-list"
- takeScreenshot: plans-fr
