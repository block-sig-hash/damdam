appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- scrollUntilVisible:
    element:
      id: "harness-target-checkout-collection-blocked"
    direction: DOWN
- tapOn:
    id: "harness-target-checkout-collection-blocked"
- assertVisible:
    id: "collection-blocked"
- takeScreenshot: checkout-collection-blocked-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- scrollUntilVisible:
    element:
      id: "harness-target-checkout-collection-blocked"
    direction: DOWN
- tapOn:
    id: "harness-target-checkout-collection-blocked"
- assertVisible:
    id: "collection-blocked"
- takeScreenshot: checkout-collection-blocked-fr
