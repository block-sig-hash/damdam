appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- tapOn:
    id: "harness-target-pin-unlock"
- assertVisible:
    id: "pin-unlock-helper-text"
- takeScreenshot: pin-unlock-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- tapOn:
    id: "harness-target-pin-unlock"
- assertVisible:
    id: "pin-unlock-helper-text"
- takeScreenshot: pin-unlock-fr
