appId: com.damdam.app
---
- launchApp
- tapOn:
    id: "harness-locale-en"
- assertVisible:
    id: "harness-locale-active-en"
- tapOn:
    id: "harness-target-gallery-status"
- assertVisible:
    id: "gallery-section-status"
- takeScreenshot: gallery-status-en
- stopApp
- launchApp
- tapOn:
    id: "harness-locale-fr"
- assertVisible:
    id: "harness-locale-active-fr"
- tapOn:
    id: "harness-target-gallery-status"
- assertVisible:
    id: "gallery-section-status"
- takeScreenshot: gallery-status-fr
