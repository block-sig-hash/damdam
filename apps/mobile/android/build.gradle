buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.5.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Native dependencies can declare their own buildscript classpaths. Add Maven
// Central before those subprojects are evaluated so a clean runner can resolve
// transitive Android Gradle Plugin artifacts even when a dependency's
// build.gradle lists only Google and the Gradle Plugin Portal. Keep this at the
// root instead of modifying generated node_modules content.
subprojects {
    buildscript {
        repositories {
            mavenCentral()
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
