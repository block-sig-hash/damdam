apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// CI intentionally has no environment-specific Firebase app registration.
// Production builds apply the official resource generator as soon as their
// google-services.json is supplied by the deployment environment.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Production must never inherit the checked-in debug key. CI's screenshot
// harness has a separate, explicitly non-production build type below.
def releaseKeystorePath = System.getenv('DAMDAM_RELEASE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('DAMDAM_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('DAMDAM_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('DAMDAM_RELEASE_KEY_PASSWORD')
def releaseCertSha256 = System.getenv('DAMDAM_RELEASE_CERT_SHA256')
def screenshotHarness = System.getenv('SCREENSHOT_HARNESS_MODE') == 'true'
def releaseSigningReady = [releaseKeystorePath, releaseStorePassword,
    releaseKeyAlias, releaseKeyPassword, releaseCertSha256].every {
    it != null && !it.trim().isEmpty()
} && releaseCertSha256 ==~ /(?i)[0-9a-f]{64}/

def certificateSha256 = { storePath, password, alias ->
    def store = java.security.KeyStore.getInstance(file(storePath), password.toCharArray())
    def certificate = store.getCertificate(alias)
    if (certificate == null) {
        throw new GradleException('Release keystore does not contain the configured certificate alias')
    }
    return java.security.MessageDigest.getInstance('SHA-256')
        .digest(certificate.encoded).encodeHex().toString()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.damdam.app"
    defaultConfig {
        applicationId "com.damdam.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        screenshot {
            // Offline-bundled Maestro fixture; never a production artifact.
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def productionTask = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i)(assemble|bundle|package|publish).*Release/
    }
    def screenshotTask = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i)(assemble|bundle|package).*Screenshot/
    }
    if (productionTask) {
        if (screenshotHarness) {
            throw new GradleException('SCREENSHOT_HARNESS_MODE is forbidden in a production release build')
        }
        if (!releaseSigningReady || !file(releaseKeystorePath).isFile()) {
            throw new GradleException('Production Android release requires a non-debug keystore and all DAMDAM_RELEASE_* signing variables, including the approved certificate SHA-256')
        }
        def releaseFingerprint = certificateSha256(
            releaseKeystorePath, releaseStorePassword, releaseKeyAlias)
        def debugFingerprint = certificateSha256('debug.keystore', 'android', 'androiddebugkey')
        if (releaseFingerprint == debugFingerprint) {
            throw new GradleException('Production Android release certificate matches the checked-in debug certificate')
        }
        if (releaseFingerprint != releaseCertSha256.toLowerCase()) {
            throw new GradleException('Production Android release certificate does not match the approved DAMDAM_RELEASE_CERT_SHA256')
        }
    }
    if (screenshotTask && !screenshotHarness) {
        throw new GradleException('Screenshot build requires SCREENSHOT_HARNESS_MODE=true')
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // 21.4.0 is compiled with Kotlin 2.3 metadata; React Native 0.86's
    // supported Kotlin toolchain is 2.1.20. 21.3.0 exposes the same geofence
    // APIs and is the newest compatible Google-published artifact.
    implementation(platform("com.google.firebase:firebase-bom:34.15.0"))
    implementation("com.google.firebase:firebase-messaging")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
