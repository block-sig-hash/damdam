openapi: 3.1.0
info:
  title: DamDam API
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - system
      summary: Liveness
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Not Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /v1/auth/otp/request:
    post:
      tags:
      - authentication
      summary: Request Otp
      operationId: request_otp_v1_auth_otp_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/otp/verify:
    post:
      tags:
      - authentication
      summary: Verify Otp
      operationId: verify_otp_v1_auth_otp_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/pin/set:
    post:
      tags:
      - authentication
      summary: Set Pin
      operationId: set_pin_v1_auth_pin_set_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PINPayload'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/auth/pin/verify:
    post:
      tags:
      - authentication
      summary: Verify Pin
      operationId: verify_pin_v1_auth_pin_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PINPayload'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PINVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/auth/pin/recovery/request:
    post:
      tags:
      - authentication
      summary: Request Pin Recovery
      operationId: request_pin_recovery_v1_auth_pin_recovery_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PINRecoveryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/pin/recovery/verify:
    post:
      tags:
      - authentication
      summary: Verify Pin Recovery
      operationId: verify_pin_recovery_v1_auth_pin_recovery_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/token/refresh:
    post:
      tags:
      - authentication
      summary: Refresh Token
      operationId: refresh_token_v1_auth_token_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/hto/register:
    post:
      tags:
      - authentication
      summary: Register Hto
      operationId: register_hto_v1_auth_hto_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTORegistrationRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/hto/verify-email:
    post:
      tags:
      - authentication
      summary: Verify Hto Email
      operationId: verify_hto_email_v1_auth_hto_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTOVerifyEmailRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/hto/login:
    post:
      tags:
      - authentication
      summary: Login Hto
      operationId: login_hto_v1_auth_hto_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTOLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTOLoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/email/verify/request:
    post:
      tags:
      - authentication
      summary: Request Email Verification
      description: Claim an email for the signed-in account and send proof-of-ownership.
      operationId: request_email_verification_v1_auth_email_verify_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailIdentifierRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityMessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/auth/email/verify/confirm:
    post:
      tags:
      - authentication
      summary: Confirm Email Verification
      operationId: confirm_email_verification_v1_auth_email_verify_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityMessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/email/recovery/request:
    post:
      tags:
      - authentication
      summary: Request Email Recovery
      operationId: request_email_recovery_v1_auth_email_recovery_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailIdentifierRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityMessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/email/recovery/confirm:
    post:
      tags:
      - authentication
      summary: Confirm Email Recovery
      description: Consume a recovery token, revoke prior sessions and issue a new
        one.
      operationId: confirm_email_recovery_v1_auth_email_recovery_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverySessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/sos-notifications/failed:
    get:
      tags:
      - admin
      summary: Failed Sos Notifications
      operationId: failed_sos_notifications_v1_admin_sos_notifications_failed_get
      responses:
        '410':
          description: This feature has been retired from the product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetiredFeatureResponse'
  /v1/admin/sos-notifications/retry-bulk:
    post:
      tags:
      - admin
      summary: Retry Sos Notifications Bulk
      operationId: retry_sos_notifications_bulk_v1_admin_sos_notifications_retry_bulk_post
      responses:
        '410':
          description: This feature has been retired from the product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetiredFeatureResponse'
  /v1/admin/sos-notifications/{notification_id}/retry:
    post:
      tags:
      - admin
      summary: Retry Sos Notification
      operationId: retry_sos_notification_v1_admin_sos_notifications__notification_id__retry_post
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Notification Id
      responses:
        '410':
          description: This feature has been retired from the product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetiredFeatureResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/device-compatibility-log:
    get:
      tags:
      - admin
      summary: List Device Compatibility Log
      operationId: list_device_compatibility_log_v1_admin_device_compatibility_log_get
      security:
      - HTTPBearer: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          title: Platform
      - name: esim_supported
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Esim Supported
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCompatibilityLogListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/hto-operators:
    get:
      tags:
      - admin
      summary: List Hto Operators
      operationId: list_hto_operators_v1_admin_hto_operators_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/HTOApprovalStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTOOperatorListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/hto-operators/{operator_id}/approve:
    post:
      tags:
      - admin
      summary: Approve Hto Operator
      operationId: approve_hto_operator_v1_admin_hto_operators__operator_id__approve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: operator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operator Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTOApprovalResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/hto-operators/{operator_id}/reject:
    post:
      tags:
      - admin
      summary: Reject Hto Operator
      operationId: reject_hto_operator_v1_admin_hto_operators__operator_id__reject_post
      security:
      - HTTPBearer: []
      parameters:
      - name: operator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operator Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTORejectionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTOApprovalResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/manifest-orders:
    get:
      tags:
      - admin
      summary: List Manifest Orders
      operationId: list_manifest_orders_v1_admin_manifest_orders_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ManifestOrderStatus'
          default: awaiting_payment
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminManifestOrderListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/manifest-orders/{order_id}/invoice:
    get:
      tags:
      - admin
      summary: Download Manifest Invoice
      operationId: download_manifest_invoice_v1_admin_manifest_orders__order_id__invoice_get
      security:
      - HTTPBearer: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/manifest-orders/{order_id}/confirm-payment:
    post:
      tags:
      - admin
      summary: Confirm Manifest Order Payment
      operationId: confirm_manifest_order_payment_v1_admin_manifest_orders__order_id__confirm_payment_post
      security:
      - HTTPBearer: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfirmationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/pricing-tiers:
    get:
      tags:
      - admin
      summary: List Admin Pricing Tiers
      operationId: list_admin_pricing_tiers_v1_admin_pricing_tiers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPricingTierListResponse'
      security:
      - HTTPBearer: []
  /v1/admin/pricing-tiers/{tier_id}:
    patch:
      tags:
      - admin
      summary: Update Admin Pricing Tier
      operationId: update_admin_pricing_tier_v1_admin_pricing_tiers__tier_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: tier_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tier Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingTierUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingTierUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/packages/{package_id}/cancel:
    post:
      tags:
      - admin
      summary: Cancel Package
      operationId: cancel_package_v1_admin_packages__package_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: package_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Package Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageCancelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/organizations:
    get:
      tags:
      - Organizations
      summary: List My Organizations
      description: Driven from memberships, so it can only ever list the caller's
        own.
      operationId: list_my_organizations_v1_organizations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
      security:
      - HTTPBearer: []
  /v1/organizations/{organization_id}/members:
    get:
      tags:
      - Organizations
      summary: List Members
      operationId: list_members_v1_organizations__organization_id__members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/organizations/{organization_id}/members/{user_id}:
    patch:
      tags:
      - Organizations
      summary: Change Member Role
      operationId: change_member_role_v1_organizations__organization_id__members__user_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Organizations
      summary: Revoke Member
      operationId: revoke_member_v1_organizations__organization_id__members__user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/organizations/{organization_id}/invitations:
    post:
      tags:
      - Organizations
      summary: Create Invitation
      operationId: create_invitation_v1_organizations__organization_id__invitations_post
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Organizations
      summary: List Invitations
      operationId: list_invitations_v1_organizations__organization_id__invitations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/organizations/{organization_id}/invitations/{invitation_id}:
    delete:
      tags:
      - Organizations
      summary: Revoke Invitation
      operationId: revoke_invitation_v1_organizations__organization_id__invitations__invitation_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invitation Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/organizations/{organization_id}/step-up:
    post:
      tags:
      - Organizations
      summary: Step Up
      description: 'Prove the second factor for one organization.


        Gated on `ORG_READ` rather than on the privileged permission being sought:

        the caller must already be a member to step up at all, but requiring the

        target permission here would turn this endpoint into a way to ask whether

        they hold it.'
      operationId: step_up_v1_organizations__organization_id__step_up_post
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
