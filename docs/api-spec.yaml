  /v1/me/lines/{entitlement_id}/installation/grant:
    post:
      tags:
      - My Line
      summary: Issue Installation Grant
      description: 'Authorize one delivery of this line''s profile. Returns no profile.


        Two calls rather than one because this half is safe to retry and the next

        half is not. A customer who taps "show my eSIM" twice gets two grants and

        spends one; a single endpoint that returned the code would have spent the

        profile on the first tap, and on a one-time-use profile that is the whole

        purchase.'
      operationId: issue_installation_grant_v1_me_lines__entitlement_id__installation_grant_post
      security:
      - HTTPBearer: []
      parameters:
      - name: entitlement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Entitlement Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationGrantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me/lines/{entitlement_id}/installation/redeem:
    post:
      tags:
      - My Line
      summary: Redeem Installation Grant
      description: "Spend a grant and return the profile, once.\n\nThe path names\
        \ the line and the token authorizes the delivery; both are\nchecked, and they\
        \ are not two ways of saying the same thing. The vault\nre-derives the holder\
        \ from the credential itself, so a token cannot be\nreplayed against a line\
        \ it was not issued for even if the path says\notherwise \u2014 the mismatch\
        \ surfaces as the same unredeemable answer as an\nexpired or already-spent\
        \ grant."
      operationId: redeem_installation_grant_v1_me_lines__entitlement_id__installation_redeem_post
      security:
      - HTTPBearer: []
      parameters:
      - name: entitlement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Entitlement Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallationRedeemRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationCredentialResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me/lines/{entitlement_id}/installation/confirm:
    post:
      tags:
      - My Line
      summary: Confirm Installation
      description: "The device reporting what it did \u2014 the only thing that may\
        \ say so.\n\nDelivering a QR code is not an installation, and neither is the\
        \ supplier\nreleasing the profile for download. Returning the refreshed line\
        \ detail\nrather than an empty 204 is deliberate: the screen that reports\
        \ an install\nis the screen that must then show activation is a *separate*\
        \ thing still\npending."
