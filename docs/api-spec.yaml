components:
  schemas:
    AdminManifestOrderListResponse:
      properties:
        orders:
          items:
            $ref: '#/components/schemas/AdminManifestOrderSummary'
          type: array
          title: Orders
      type: object
      required:
      - orders
      title: AdminManifestOrderListResponse
    AdminManifestOrderSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        hto_business_name:
          type: string
          title: Hto Business Name
        manifest_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Manifest Name
        pilgrim_count:
          type: integer
          title: Pilgrim Count
        total_ngn:
          type: number
          title: Total Ngn
        invoice_url:
          type: string
          title: Invoice Url
        days_pending:
          type: integer
          title: Days Pending
      type: object
      required:
      - id
      - hto_business_name
      - manifest_name
      - pilgrim_count
      - total_ngn
      - invoice_url
      - days_pending
      title: AdminManifestOrderSummary
    AuthResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        user:
          $ref: '#/components/schemas/UserResponse'
        is_new_user:
          type: boolean
          title: Is New User
      type: object
      required:
      - access_token
      - refresh_token
      - user
      - is_new_user
      title: AuthResponse
    Body_upload_manifest_v1_hto_manifests__manifest_id__upload_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_manifest_v1_hto_manifests__manifest_id__upload_post
    FamilyContactCreate:
      properties:
        phone_number:
          type: string
          title: Phone Number
        name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Name
      type: object
      required:
      - phone_number
      title: FamilyContactCreate
    FamilyContactResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        phone_number:
          type: string
          title: Phone Number
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        notified_of_nomination:
          type: boolean
          title: Notified Of Nomination
      type: object
      required:
      - id
      - phone_number
      - name
      - notified_of_nomination
      title: FamilyContactResponse
    FamilyContactUpdate:
      properties:
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
        name:
          anyOf:
