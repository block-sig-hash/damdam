          anyOf:
          - type: boolean
          - type: 'null'
          title: Esim Supported
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCompatibilityLogListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Device Compatibility Log
      tags:
      - admin
