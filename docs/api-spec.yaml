    post:
      tags:
      - authentication
      summary: Confirm Email Login
      description: Prove mailbox control, then create or authenticate the account.
      operationId: confirm_email_login_v1_auth_email_login_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/email/recovery/request:
    post:
      tags:
      - authentication
      summary: Request Email Recovery
      operationId: request_email_recovery_v1_auth_email_recovery_request_post
      requestBody:
        content:
          application/json:
