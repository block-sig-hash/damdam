      properties:
        keep_session_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Keep Session Id
      type: object
      title: RevokeAllRequest
      description: "Sign everything out, optionally sparing one device.\n\nThe device\
        \ to keep is named explicitly rather than inferred from the\nrequest, because\
        \ an access token does not carry the id of the session it\ncame from and inferring\
        \ it would mean guessing. The named session is still\nverified against the\
        \ caller \u2014 it is skipped only if it appears in *their*\ndevice list \u2014\
        \ so naming somebody else's spares nothing.\n\nOmitting it signs out every\
        \ device including this one, which is the right\ndefault for \"my phone was\
        \ stolen\" and is what the app asks for when the\ncustomer confirms they are\
        \ signing themselves out too."
