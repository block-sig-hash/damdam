info:
  title: DamDam API
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: Successful Response
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: Not Ready
      summary: Health
      tags:
      - system
  /health/live:
    get:
      operationId: liveness_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
          description: Successful Response
      summary: Liveness
      tags:
      - system
  /v1/activation/{activation_code}:
    get:
      operationId: preview_activation_v1_activation__activation_code__get
      parameters:
      - in: path
        name: activation_code
        required: true
        schema:
          title: Activation Code
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationPreviewResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Preview Activation
      tags:
      - pilgrim-activation
  /v1/admin/device-compatibility-log:
    get:
