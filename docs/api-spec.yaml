          maxLength: 2
          title: Country
      - name: currency
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 3
          title: Currency
      - name: device_offers_apple_pay
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Device Offers Apple Pay
      - name: device_offers_google_pay
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Device Offers Google Pay
      responses:
