      description: "What the call actually cost, once it has been metered \u2014 US-46,\
        \ V03.\n\nAbsent until the call is settled, and `is_final` says whether the\
        \ supplier's\nown record could still move it. A UI that showed a provisional\
        \ amount as\nfinal would be making a promise this chunk cannot keep: V01 could\
        \ not\nestablish how many components a call bills, so a later correction is\
        \ an\nordinary event rather than a failure."
