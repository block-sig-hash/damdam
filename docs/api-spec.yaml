      summary: List Products
      description: 'What can be bought here, and for anything that cannot, why not.


        The device facts are **optional and tri-state**. Omitting `supports_esim`

        means "not checked", which is not the same as "checked and incapable": the

        first still lists eSIM plans with a reason to check the device, and the

        second does not pretend the plan will work. The chunk forbids implying

        guaranteed detection, and this is the shape that keeps the promise.'
      operationId: list_products_v1_catalog_products_get
      parameters:
      - name: country
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 2
          title: Country
      - name: currency
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 3
          title: Currency
      - name: supports_esim
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Supports Esim
      - name: is_unlocked
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Unlocked
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
