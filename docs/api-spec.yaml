components:
  schemas:
    AccountDeletionResponse:
      properties:
        status:
          type: string
          const: pending_deletion
          title: Status
          default: pending_deletion
        deletion_scheduled_for:
          type: string
          format: date-time
          title: Deletion Scheduled For
      type: object
      required:
      - deletion_scheduled_for
      title: AccountDeletionResponse
    ActivationPreviewResponse:
      properties:
        valid:
          type: boolean
          title: Valid
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        organization_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization Name
        pricing_tier_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Pricing Tier Name
      type: object
      required:
      - valid
      - reason
      - organization_name
      - pricing_tier_name
      title: ActivationPreviewResponse
    ActivationRedeemRequest:
      properties:
        activation_code:
          type: string
          title: Activation Code
      type: object
      required:
      - activation_code
      title: ActivationRedeemRequest
    ActivationRedeemResponse:
      properties:
        package_id:
          type: string
          format: uuid
          title: Package Id
        pricing_tier_name:
          type: string
          title: Pricing Tier Name
        data_gb_total:
          type: integer
          title: Data Gb Total
        pstn_minutes_total:
          type: integer
          title: Pstn Minutes Total
        status:
          type: string
          title: Status
      type: object
      required:
      - package_id
