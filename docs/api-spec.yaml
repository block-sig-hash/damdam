openapi: 3.1.0
info:
  title: DamDam API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /v1/auth/otp/request:
    post:
      tags:
      - authentication
      summary: Request Otp
      operationId: request_otp_v1_auth_otp_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/otp/verify:
    post:
      tags:
      - authentication
      summary: Verify Otp
      operationId: verify_otp_v1_auth_otp_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/pin/set:
    post:
      tags:
      - authentication
      summary: Set Pin
      operationId: set_pin_v1_auth_pin_set_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PINPayload'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/auth/pin/verify:
    post:
      tags:
      - authentication
      summary: Verify Pin
      operationId: verify_pin_v1_auth_pin_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PINPayload'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PINVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/auth/pin/recovery/request:
    post:
      tags:
      - authentication
      summary: Request Pin Recovery
      operationId: request_pin_recovery_v1_auth_pin_recovery_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PINRecoveryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/pin/recovery/verify:
    post:
      tags:
      - authentication
      summary: Verify Pin Recovery
      operationId: verify_pin_recovery_v1_auth_pin_recovery_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/token/refresh:
    post:
      tags:
      - authentication
      summary: Refresh Token
      operationId: refresh_token_v1_auth_token_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/hto/register:
    post:
      tags:
      - authentication
      summary: Register Hto
      operationId: register_hto_v1_auth_hto_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTORegistrationRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/hto/verify-email:
    post:
      tags:
      - authentication
      summary: Verify Hto Email
      operationId: verify_hto_email_v1_auth_hto_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTOVerifyEmailRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/hto/login:
    post:
      tags:
      - authentication
      summary: Login Hto
      operationId: login_hto_v1_auth_hto_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTOLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTOLoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/hto-operators:
    get:
      tags:
      - admin
      summary: List Hto Operators
      operationId: list_hto_operators_v1_admin_hto_operators_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/HTOApprovalStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTOOperatorListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/hto-operators/{operator_id}/approve:
    post:
      tags:
      - admin
      summary: Approve Hto Operator
      operationId: approve_hto_operator_v1_admin_hto_operators__operator_id__approve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: operator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operator Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTOApprovalResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/hto/manifests:
    get:
      tags:
      - HTO manifests
      summary: List Manifests
      operationId: list_manifests_v1_hto_manifests_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestListResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - HTO manifests
      summary: Create Manifest
      operationId: create_manifest_v1_hto_manifests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManifestCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/hto/manifests/{manifest_id}/upload:
    post:
      tags:
      - HTO manifests
      summary: Upload Manifest
      operationId: upload_manifest_v1_hto_manifests__manifest_id__upload_post
      security:
      - HTTPBearer: []
      parameters:
      - name: manifest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manifest Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_manifest_v1_hto_manifests__manifest_id__upload_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/hto/manifests/{manifest_id}/confirm:
    post:
      tags:
      - HTO manifests
      summary: Confirm Manifest
      operationId: confirm_manifest_v1_hto_manifests__manifest_id__confirm_post
      security:
      - HTTPBearer: []
      parameters:
      - name: manifest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manifest Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestConfirmResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/webhooks/otp/termii:
    post:
      tags:
      - webhooks
      summary: Termii Delivery Report
      operationId: termii_delivery_report_v1_webhooks_otp_termii_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
                title: Response Termii Delivery Report V1 Webhooks Otp Termii Post
  /v1/me/family-contact:
    post:
      tags:
      - pilgrim-profile
      summary: Create Family Contact
      operationId: create_family_contact_v1_me_family_contact_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyContactCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyContactResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - pilgrim-profile
      summary: Update Family Contact
      operationId: update_family_contact_v1_me_family_contact_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyContactUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyContactResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    AuthResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        user:
          $ref: '#/components/schemas/UserResponse'
        is_new_user:
          type: boolean
          title: Is New User
      type: object
      required:
      - access_token
      - refresh_token
      - user
      - is_new_user
      title: AuthResponse
    Body_upload_manifest_v1_hto_manifests__manifest_id__upload_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_manifest_v1_hto_manifests__manifest_id__upload_post
    FamilyContactCreate:
      properties:
        phone_number:
          type: string
          title: Phone Number
        name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Name
      type: object
      required:
      - phone_number
      title: FamilyContactCreate
    FamilyContactResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        phone_number:
          type: string
          title: Phone Number
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        notified_of_nomination:
          type: boolean
          title: Notified Of Nomination
      type: object
      required:
      - id
      - phone_number
      - name
      - notified_of_nomination
      title: FamilyContactResponse
    FamilyContactUpdate:
      properties:
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
        name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Name
      type: object
      title: FamilyContactUpdate
    HTOApprovalResponse:
      properties:
        approval_status:
          $ref: '#/components/schemas/HTOApprovalStatus'
      type: object
      required:
      - approval_status
      title: HTOApprovalResponse
    HTOApprovalStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      title: HTOApprovalStatus
    HTOLoginRequest:
      properties:
        email:
          type: string
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - email
      - password
      title: HTOLoginRequest
    HTOLoginResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        operator:
          $ref: '#/components/schemas/HTOOperatorResponse'
      type: object
      required:
      - access_token
      - refresh_token
      - operator
      title: HTOLoginResponse
    HTOOperatorListResponse:
      properties:
        operators:
          items:
            $ref: '#/components/schemas/HTOOperatorResponse'
          type: array
          title: Operators
      type: object
      required:
      - operators
      title: HTOOperatorListResponse
    HTOOperatorResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        business_name:
          type: string
          title: Business Name
        operator_name:
          type: string
          title: Operator Name
        email:
          type: string
          title: Email
        phone_number:
          type: string
          title: Phone Number
        nahcon_licence_number:
          type: string
          title: Nahcon Licence Number
        email_verified:
          type: boolean
          title: Email Verified
        approval_status:
          $ref: '#/components/schemas/HTOApprovalStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - business_name
      - operator_name
      - email
      - phone_number
      - nahcon_licence_number
      - email_verified
      - approval_status
      - created_at
      title: HTOOperatorResponse
    HTORegistrationRequest:
      properties:
        business_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Business Name
        operator_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Operator Name
        email:
          type: string
          maxLength: 255
          minLength: 3
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
        phone_number:
          type: string
          title: Phone Number
        nahcon_licence_number:
          type: string
          maxLength: 50
          minLength: 1
          title: Nahcon Licence Number
      type: object
      required:
      - business_name
      - operator_name
      - email
      - password
      - phone_number
      - nahcon_licence_number
      title: HTORegistrationRequest
    HTOVerifyEmailRequest:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
      type: object
      required:
      - token
      title: HTOVerifyEmailRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ManifestConfirmResponse:
      properties:
        status:
          type: string
          const: validated
          title: Status
          default: validated
        pilgrim_count:
          type: integer
          title: Pilgrim Count
      type: object
      required:
      - pilgrim_count
      title: ManifestConfirmResponse
    ManifestCreateRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Name
      type: object
      title: ManifestCreateRequest
    ManifestCreateResponse:
      properties:
        manifest_id:
          type: string
          format: uuid
          title: Manifest Id
        status:
          type: string
          const: draft
          title: Status
          default: draft
      type: object
      required:
      - manifest_id
      title: ManifestCreateResponse
    ManifestIssue:
      properties:
        row_number:
          type: integer
          title: Row Number
        reason:
          type: string
          title: Reason
      type: object
      required:
      - row_number
      - reason
      title: ManifestIssue
    ManifestListResponse:
      properties:
        manifests:
          items:
            $ref: '#/components/schemas/ManifestSummary'
          type: array
          title: Manifests
      type: object
      required:
      - manifests
      title: ManifestListResponse
    ManifestPreviewRow:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        row_number:
          type: integer
          title: Row Number
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        phone_number:
          type: string
          title: Phone Number
        passport_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Passport Number
        seat_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Seat Number
        validation_status:
          type: string
          enum:
          - valid
          - duplicate_warning
          title: Validation Status
        warning:
          anyOf:
          - type: string
          - type: 'null'
          title: Warning
      type: object
      required:
      - id
      - row_number
      - first_name
      - last_name
      - phone_number
      - passport_number
      - seat_number
      - validation_status
      title: ManifestPreviewRow
    ManifestStatus:
      type: string
      enum:
      - draft
      - validated
      - partially_ordered
      - provisioned
      title: ManifestStatus
    ManifestSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        status:
          $ref: '#/components/schemas/ManifestStatus'
        valid_rows:
          type: integer
          title: Valid Rows
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - status
      - valid_rows
      - created_at
      title: ManifestSummary
    ManifestUploadResponse:
      properties:
        total_rows:
          type: integer
          title: Total Rows
        valid_rows:
          type: integer
          title: Valid Rows
        invalid_rows:
          items:
            $ref: '#/components/schemas/ManifestIssue'
          type: array
          title: Invalid Rows
        preview:
          items:
            $ref: '#/components/schemas/ManifestPreviewRow'
          type: array
          title: Preview
      type: object
      required:
      - total_rows
      - valid_rows
      - invalid_rows
      - preview
      title: ManifestUploadResponse
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: MessageResponse
    OTPRequest:
      properties:
        phone_number:
          type: string
          title: Phone Number
      type: object
      required:
      - phone_number
      title: OTPRequest
    OTPVerifyRequest:
      properties:
        phone_number:
          type: string
          title: Phone Number
        otp:
          type: string
          title: Otp
        platform:
          $ref: '#/components/schemas/Platform'
      type: object
      required:
      - phone_number
      - otp
      - platform
      title: OTPVerifyRequest
    PINPayload:
      properties:
        pin:
          type: string
          title: Pin
      type: object
      required:
      - pin
      title: PINPayload
    PINRecoveryRequest:
      properties:
        phone_number:
          type: string
          title: Phone Number
      type: object
      required:
      - phone_number
      title: PINRecoveryRequest
    PINVerifyResponse:
      properties:
        unlocked:
          type: boolean
          const: true
          title: Unlocked
          default: true
      type: object
      title: PINVerifyResponse
    Platform:
      type: string
      enum:
      - ios
      - android
      title: Platform
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: RefreshRequest
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
      - access_token
      - refresh_token
      title: TokenResponse
    UserResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        phone_number:
          type: string
          title: Phone Number
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        verified_cli:
          type: boolean
          title: Verified Cli
        platform:
          type: string
          title: Platform
        status:
          type: string
          title: Status
      type: object
      required:
      - id
      - phone_number
      - first_name
      - last_name
      - email
      - verified_cli
      - platform
      - status
      title: UserResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
