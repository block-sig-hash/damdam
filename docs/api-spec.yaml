      properties:
        token:
          type: string
          title: Token
      type: object
      required:
      - token
      title: InvitationPreviewRequest
      description: 'The token travels in the body, not the path.


        A path segment reaches access logs, proxy logs and crash reports. An

        invitation token is a bearer credential for a membership, so it goes where

        those do not follow.'
