openapi: 3.1.0
info:
  title: DamDam API
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - system
      summary: Liveness
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Not Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
