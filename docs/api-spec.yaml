    InstallationConfirmRequest:
      properties:
        installed:
          type: boolean
          title: Installed
      type: object
      required:
      - installed
      title: InstallationConfirmRequest
      description: "The device reporting what it did.\n\n`installed: false` is accepted\
        \ and recorded as *not* installed rather than\nignored \u2014 a failed install\
        \ that leaves the record saying \"installed\" is how\na customer ends up being\
        \ told their line is ready when nothing is on the\nphone."
    InstallationCredentialResponse:
      properties:
        entitlement_id:
          type: string
          format: uuid
          title: Entitlement Id
        lpa:
          type: string
          title: Lpa
        one_time_use:
          type: boolean
          title: One Time Use
        delivery_count:
          type: integer
          title: Delivery Count
        reinstall_available:
          type: boolean
          title: Reinstall Available
      type: object
      required:
      - entitlement_id
      - lpa
      - one_time_use
      - delivery_count
      - reinstall_available
      title: InstallationCredentialResponse
      description: 'The profile, once.


        Served with `Cache-Control: no-store`. The `lpa` is the whole secret: anyone

        holding it can install the profile instead of the customer, and a Telnyx

        profile cannot be re-downloaded, so there is nothing to rotate afterwards.'
    InstallationGrantResponse:
      properties:
        grant_token:
          type: string
          title: Grant Token
        expires_at:
          type: string
          format: date-time
          title: Expires At
        one_time_use:
          type: boolean
          title: One Time Use
        delivery_count:
          type: integer
          title: Delivery Count
      type: object
      required:
      - grant_token
      - expires_at
      - one_time_use
      - delivery_count
      title: InstallationGrantResponse
      description: "Authorization to fetch the profile once \u2014 never the profile\
        \ itself.\n\nThe token is returned here and is not stored server-side in a\
        \ usable form;\nthe row keeps a keyed fingerprint. A response that carried\
        \ the activation\ncode would put installation material into every log, proxy\
        \ and crash report\nbetween here and the phone."
    InstallationRedeemRequest:
      properties:
        grant_token:
          type: string
          title: Grant Token
      type: object
      required:
      - grant_token
      title: InstallationRedeemRequest
